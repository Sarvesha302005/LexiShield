services:
  dispute-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paypal_dispute_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-mock_paypal_client_id}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-mock_paypal_client_secret}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-mock_paypal_webhook_id}
      - PAYPAL_API_BASE_URL=${PAYPAL_API_BASE_URL:-https://api-m.sandbox.paypal.com}
      - STRICT_WEBHOOK_VERIFICATION=${STRICT_WEBHOOK_VERIFICATION:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock_gemini_api_key}
      - GEMINI_MODEL=${GEMINI_MODEL:-google/gemini-2.0-flash-thinking-exp:free}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-mock_openrouter_api_key}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_PRIMARY_MODEL=${OPENROUTER_PRIMARY_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      - OPENROUTER_BACKUP_MODEL=${OPENROUTER_BACKUP_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-mock_nvidia_api_key}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_PRIMARY_MODEL=${NVIDIA_PRIMARY_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      - NVIDIA_FALLBACK_MODEL=${NVIDIA_FALLBACK_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - NVIDIA_CHAT_PRIMARY_MODEL=${NVIDIA_CHAT_PRIMARY_MODEL:-nvidia/nemotron-3.5-bolt-e4b}
      - NVIDIA_CHAT_FALLBACK_MODEL=${NVIDIA_CHAT_FALLBACK_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - SELLER_RIGHTS_FIRST_ENABLED=${SELLER_RIGHTS_FIRST_ENABLED:-true}
      - STANDARD_DISPUTE_FEE=${STANDARD_DISPUTE_FEE:-15.00}
      - HIGH_VOLUME_DISPUTE_FEE=${HIGH_VOLUME_DISPUTE_FEE:-30.00}
      - DEFEND_P_WIN_THRESHOLD=${DEFEND_P_WIN_THRESHOLD:-0.70}
      - HITL_ORDER_VALUE_THRESHOLD=${HITL_ORDER_VALUE_THRESHOLD:-300.00}
      - HITL_P_WIN_LOWER=${HITL_P_WIN_LOWER:-0.60}
      - HITL_P_WIN_UPPER=${HITL_P_WIN_UPPER:-0.75}
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
