# Render Infrastructure-as-Code Blueprint
# LexiShield Enterprise PayPal Dispute Resolution & Defense System
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: lexishield-paypal-defense-engine
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true

    # Note: Persistent disk requires Render Starter plan ($7/mo + $0.25/GB).
    # For Render 100% Free Tier, disk is omitted; dossiers and SQLite live in container filesystem
    # and automatically re-seed on spin-up.
    # disk:
    #   name: dossier-artifacts
    #   mountPath: /app/artifacts
    #   sizeGB: 10

    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PAYPAL_MODE
        value: sandbox
      - key: API_V1_STR
        value: /api/v1
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_PRIMARY_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_FALLBACK_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: OPENROUTER_BACKUP_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_PRIMARY_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: NVIDIA_FALLBACK_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_CHAT_PRIMARY_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      - key: NVIDIA_CHAT_FALLBACK_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
