# Dependabot configuration for LexiShield
version: 2
updates:
  # Maintain dependencies for Python pip packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "Sarvesha302005"
    labels:
      - "dependencies"
      - "security"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    reviewers:
      - "Sarvesha302005"
    labels:
      - "ci"
      - "github-actions"
